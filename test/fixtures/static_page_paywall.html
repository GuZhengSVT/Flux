    <h1>深度报道</h1>
    <p>本文为订阅专享内容。订阅后可读全文，登录后阅读已购内容。</p>
    <p>以下是试读部分的若干段落，用于说明该站点通常只在付费墙之前放出一小段内容，其余部分需要订阅才能继续阅读。</p>
    <p>试读段落之二：很多站点会在服务端只返回试读内容，因此静态抓取拿到的就是这些文字，没有任何绕过的方式。</p>
    <p>试读段落之三：本应用不会尝试绕过访问限制，遇到这种情况只给出提示并提供外部浏览器入口。</p>
    <p>试读段落之四：之所以仍然把这一段保存下来，是因为用户对自己的订阅内容有权获取，而静态抓取拿到的就是服务端已经发出来的东西。</p>
    <p>试读段落之五：是否值得为此付费由用户判断，应用只负责如实说明「这里是付费墙之前的部分」。</p>
