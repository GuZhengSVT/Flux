<!doctype html>
<html>
<head><title>畸形页面
<body>
<div class="article-content">
<p>这段 HTML 没有闭合的标题、没有闭合的 head，段落标签也缺了结束标签。
<p>正文仍然应当被抽出来，因为真实网页里这类残缺非常常见。
<p>宽容解析的目标不是接受畸形，而是不让一份残缺的页面对用户表现为「什么都没有」。
<p>这里再补几句让正文长度超过可用阈值，从而验证抽取器确实把这段文字当成正文。
<p>第六段用于继续增加长度，确保这段文本足够长，可以被判定为可用正文而不是纯脚本渲染。
<p>第七段继续补充正文长度，使这段畸形 HTML 的可见文字超过可用正文的最小阈值，从而验证抽取器不会把它误判成纯脚本渲染的页面。
<p>第八段：宽容解析的另一面是要如实标注结果——如果内容确实太短，就应当归类为「可能纯 JS 渲染」，而不是假装成功。
<p>第九段：这段文字本身的长度已经足够，因此本页应当被判定为可用正文。</p>
</div>
</body>
