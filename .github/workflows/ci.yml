# Flux CI 基线（T006 建立，T008 锁定工具链）
#
# 设计取舍：
# - matrix 仅 macos-latest。Android 按 D-02/D-03 暂缓，等 Android 阶段再补 runner。
# - 只做静态检查与单元/组件测试，**不在此运行构建**：macOS release 构建耗时与
#   磁盘占用都很高，构建回归放在本地验收（见 README 的 macOS 构建与 T008 契约）。
# - 工作流不引用任何秘密（无 API Key、无签名证书、无付费服务）。若某步骤需要
#   凭据才能运行，则该步骤不应出现在这里。
# - 强制使用已提交的 pubspec.lock，保证 CI 与本地依赖一致。
#
# T008 变更：
#   1) Flutter 版本由占位 x.y.z 锁定为 3.47.0（T005 工具链记录的实际版本）；
#   2) pub get 加 --enforce-lockfile，lock 与 pubspec.yaml 不一致时直接失败；
#   3) 格式检查范围由 `.` 收敛为 `lib test`，与手册 6.2 的命令基线一致，
#      避免把平台工程与构建产物一并纳入格式要求。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 最小权限：只需要读仓库内容。
permissions:
  contents: read

# 同一分支的新提交取消仍在跑的旧任务，避免排队浪费。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 降低 Flutter/Dart 遥测与匿名统计，保持 CI 输出可控。
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DART_SUPPRESS_ANALYTICS: "true"

jobs:
  analyze-and-test:
    name: format / analyze / test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Android 暂缓，不在本文件添加 android runner。
        os:
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Flutter 版本：已按 T005 工具链记录锁定为 3.47.0（对应 Dart 3.13.0）。
      # 固定精确版本而不是只写 channel: stable，避免 CI 随上游升级而改变行为。
      # 升级时须同步更新本文件与手册 7.2 的工具链表，并重跑本地命令基线。
      # ------------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      # pubspec.lock 已提交（见 .gitignore 的说明），因此正常路径是复现同一份依赖。
      # --enforce-lockfile：lock 与 pubspec.yaml 不一致时直接失败，而不是静默升级。
      # 这样 CI 与本地、以及不同时间的构建都使用完全相同的依赖版本。
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # 格式检查只读、不修改；范围与手册 6.2 的命令基线一致（lib test）。
      # build_runner 生成物（*.g.dart）不手写格式，因此不把 build/ 纳入范围。
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze
        # 若希望 info 级提示也阻断合并，可在稳定后改为 flutter analyze --fatal-infos；
        # 现在保持默认（不加 --fatal-infos），避免初期脚手架信息噪音造成假红。
        # T008 本机基线：flutter analyze 退出 0、0 issue。后续引入 lint 噪音应修代码
        # 而不是长期放宽；待无新增噪音并稳定后再评估加严。

      # 单元与组件测试。默认不触网：需要外部服务的用例应使用本地 fixture/mock。
      - name: Test
        run: flutter test --reporter expanded
