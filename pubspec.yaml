name: flux
description: "Local-first news & RSS reader"
# T006 脚手架基线：本文件只声明依赖，功能实现在 T007 之后落地。
# 依赖版本按 pub.dev 最新稳定版固定，并由已提交的 pubspec.lock 复现（见 .gitignore 说明）。
publish_to: 'none'

# 版本：新工程从 0.2.0 起算，与已封存的旧版 0.1.x 明确区分（见 docs/legacy/README.md）。
version: 0.2.0+1

environment:
  # 与 T005 锁定的工具链一致：Flutter 3.47.0 / Dart 3.13.0。
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Material 图标字体，模板默认依赖。
  cupertino_icons: ^1.0.9

  # 状态管理（架构 D-07）：单一方案，不使用其他状态库。
  flutter_riverpod: ^3.4.3

  # 本地数据库（架构 D-08）。drift 2.35 直接依赖 sqlite3 ^3.4.0，
  # 由 sqlite3 3.x 的原生资源机制自带 SQLite 动态库。
  # 原 sqlite3_flutter_libs 已 EOL（最新版 0.6.0+eol，官方说明“不再使用，
  # 请升级到 sqlite3 3.x”），因此这里直接声明 sqlite3。
  drift: ^2.35.0
  sqlite3: ^3.6.0

  # 路径与网络。
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # drift 代码生成。
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # 资源与字体在 T012（原创 SVG/设计 token）落地后补充，此处不预置不存在的路径。
