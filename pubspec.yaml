name: flux
description: "Local-first news & RSS reader"
# T006 脚手架基线：本文件只声明依赖，功能实现在 T007 之后落地。
# 依赖版本按 pub.dev 最新稳定版固定，并由已提交的 pubspec.lock 复现（见 .gitignore 说明）。
publish_to: 'none'

# 版本：新工程从 0.2.0 起算，与已封存的旧版 0.1.x 明确区分（见 docs/legacy/README.md）。
version: 0.2.0+1

environment:
  # 与 T005 锁定的工具链一致：Flutter 3.47.0 / Dart 3.13.0。
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 官方国际化（T011）。flutter_localizations 提供 Material/Cupertino 自带的
  # 中文/英文文案与 LocalizationsDelegate 基础设施；gen_l10n 生成物依赖 intl
  # （flutter_localizations 本身也依赖它）。这两项是 Flutter 官方 i18n 的必需依赖，
  # 不是第三方插件。
  flutter_localizations:
    sdk: flutter
  intl: any

  # Material 图标字体，模板默认依赖。
  cupertino_icons: ^1.0.9

  # 状态管理（架构 D-07）：单一方案，不使用其他状态库。
  flutter_riverpod: ^3.4.3

  # 本地数据库（架构 D-08）。drift 2.35 直接依赖 sqlite3 ^3.4.0，
  # 由 sqlite3 3.x 的原生资源机制自带 SQLite 动态库。
  # 原 sqlite3_flutter_libs 已 EOL（最新版 0.6.0+eol，官方说明“不再使用，
  # 请升级到 sqlite3 3.x”），因此这里直接声明 sqlite3。
  drift: ^2.35.0
  sqlite3: ^3.6.0

  # 路径与网络。
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0

  # 原创 SVG 图标的运行时渲染（T012）。
  # 为什么用 flutter_svg 而不是 vector_graphics 的编译管线：
  #   编译管线需要把每个 SVG 预编译为二进制资源（build_runner 代码生成或
  #   vector_graphics_compiler 命令行），会引入一套额外的构建步骤与生成物管理；
  #   T012 只有约 20 个几何简单的小图标，运行期解析的开销可忽略，而
  #   「资源与代码一一对应、不需要重新生成」的可维护性更重要。
  #   两者共用同一套解析与绘制实现（flutter_svg 内部依赖 vector_graphics 与
  #   vector_graphics_compiler 的解析器），因此没有引入第二套渲染语义。
  flutter_svg: ^2.3.0

  # RSS/Atom 解析（T013）。选官方维护的 renggli/dart-xml：
  #   - 提供 DOM 与事件流两种入口，T013 需要「解析前先拒绝 DTD/外部实体」，
  #     事件流入口可以在实体被展开前就中止解析；
  #   - 纯 Dart 实现，无原生依赖，不引入 WebView 或网页运行时（架构第 8 节）。
  xml: ^7.0.1

  # 文件选择/保存对话框（T015 的 OPML 导入与导出）。
  # 选 Flutter 官方维护的 file_selector 而不是 file_picker：
  #   - file_selector 由 flutter/packages 维护，直接对接 macOS 的 NSOpenPanel/
  #     NSSavePanel（沙盒下通过 security-scoped bookmark 授权访问用户选中的文件），
  #     与项目「平台桥接只用于文件/分享等平台边界」的路线一致；
  #   - file_picker 在 macOS 上同样可用，但它自带的 iOS/Android 权限申请与
  #     「下载/云盘」入口引入了本项目不需要的抽象层。
  # 注意：本项目**不**直接把文件路径写进数据库——导入读文件、导出写文件，
  # 文件内容随后进入 OPML 用例，数据库仍只保存解析后的订阅。
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 平台集成测试（T010 的 Keychain 真机实测必需）。
  # flutter_test 只跑纯 Dart/组件测试，无法驱动 macOS 原生通道；
  # integration_test 让测试运行在真实设备/桌面上，才能实际写入并读回 Keychain。
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # drift 代码生成。
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # 生成 AppLocalizations（T011）。generate: true 让 flutter pub get / build /
  # test 自动跑 gen_l10n，ARB 与生成物不会不同步。配置见仓库根 l10n.yaml。
  generate: true

  # 原创 SVG 图标（T012）。全部为手写几何图形，MIT 授权见各文件顶部注释与
  # 仓库根 LICENSE。每个图标同时提供 24 与 20 两套逻辑尺寸（架构第 7 节），
  # 文件名后缀即其设计尺寸，控件按当前断点选择。
  #
  # 只声明真实存在的目录，不放猜测路径；test/app/flux_icons_test.dart 会校验
  # 声明与磁盘文件一一对应。
  assets:
    - assets/icons/
